<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINDLOOM · 织风</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #16222e; color: #cfe6ff; font-family: sans-serif; text-align: center; }
  h1 { font-size: 20px; color: #d9c25a; margin: 0 0 16px; letter-spacing: 2px; }
  #screen { width: min(880px, calc(100vw - 32px)); aspect-ratio: 800 / 520; height: auto;
    background: #16222e; border: 1px solid #3a4a38; border-radius: 6px; cursor: pointer; touch-action: none; }
  #status { margin-top: 8px; font-size: 13px; color: #9fb3c8; }
  .hint { max-width: 720px; margin: 16px auto 0; font-size: 14px; line-height: 1.7; color: #b8cade; }
  .hint b { color: #d9c25a; }
</style>
</head>
<body>
<h1>WINDLOOM · 织风</h1>
<canvas id="screen"></canvas>
<div id="status">loading module…</div>
<p class="hint"><b>怎么玩：手指拖动即「织风」。</b>画出的每笔都是一道持久流动的气流（虚线），把母株陆续撒落的种子吹进土窝<b>开花</b>——三个土窝都种满即完成花园。带刺的蔷薇丛会杀死触碰的种子，落在外面的空地只长草。</p>
<script>window.DEMO_CONFIG = { width: 800, height: 520, timeTravel: false };</script>
<script src="proto_host.js"></script>
<script src="windloom.js"></script>
</body>
</html>
