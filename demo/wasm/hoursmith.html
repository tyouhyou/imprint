<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOURSMITH · 晷匠</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #0a0c1c; color: #e0dcd0; font-family: sans-serif; text-align: center; }
  h1 { font-size: 20px; color: #ffe2a8; margin: 0 0 16px; letter-spacing: 2px; }
  #screen { width: min(880px, calc(100vw - 32px)); aspect-ratio: 800 / 520; height: auto;
    background: #0a0c1c; border: 1px solid #2a3a4a; border-radius: 6px; cursor: pointer; touch-action: none; }
  #status { margin-top: 8px; font-size: 13px; color: #9fb3c8; }
  .hint { max-width: 720px; margin: 16px auto 0; font-size: 14px; line-height: 1.7; color: #c8c2b4; }
  .hint b { color: #ffe2a8; }
</style>
</head>
<body>
<h1>HOURSMITH · 晷匠</h1>
<canvas id="screen"></canvas>
<div id="status">loading module…</div>
<p class="hint"><b>怎么玩：你是日晷台的匠人。</b>太阳从清晨六点跑到傍晚六点，每块色石的影子尖端随之扫过石盘。把色石<b>拖</b>到合适的位置（点住石头拖动；点选后用右侧上下键或 <b>[ ]</b> 键调高矮），让它的影子尖端在色环自己的钟点<b>落进色环</b>并坚持到钟声敲响。清晨与傍晚影子又长又急，正午影子最短最稳。按 <b>1–4</b> 跳级。左下角是匠人的图纸，下方时间轴就是太阳本身。暮色收钟。</p>
<script>window.DEMO_CONFIG = { width: 800, height: 520, timeTravel: false, pixelOrder: "rgba" };</script>
<script src="proto_host.js"></script>
<script src="hoursmith.js"></script>
</body>
</html>
