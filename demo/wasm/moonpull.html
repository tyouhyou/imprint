<style>
  body { margin: 0; padding: 24px 16px; background: #060816; color: #d8e4f4; font-family: sans-serif; text-align: center; }
  h1 { font-size: 20px; color: #9fd8ff; margin: 0 0 16px; letter-spacing: 2px; }
  #screen { width: min(880px, calc(100vw - 32px)); aspect-ratio: 800 / 520; height: auto;

  #status { margin-top: 8px; font-size: 13px; color: #9fb3c8; }

<body>
<h1>MOONPULL · 引潮记</h1>
<canvas id="screen"></canvas>
<div id="status">loading module…</div>
<p class="hint"><b>怎么玩：按住拖动，月亮就在你手里。</b>横向拖让月亮绕海环行，竖向拖升降月亮（越低潮力越大）。潮峰永远跟着月亮的方向鼓起——把<b>潮峰</b>停在渡口的礁道上，渡船才会起航（1/3）；把<b>潮谷</b>压在珠蚌床上晾干它（2/3）；最后在灯芯烧尽前别让潮水漫上<b>灯笼屿</b>（3/3）。黎明为限。</p>
<script>window.DEMO_CONFIG = { width: 800, height: 520, timeTravel: false, pixelOrder: "rgba" };</script>

<script src="moonpull.js"></script>
