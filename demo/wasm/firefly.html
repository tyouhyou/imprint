<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIREFLY GROVE · 萤火林</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #060a18;
    color: #cfe6ff;
    font-family: sans-serif;
    text-align: center;
  }
  h1 { font-size: 20px; color: #ffe98a; margin: 0 0 16px; letter-spacing: 2px; }
  #screen {
    width: min(880px, calc(100vw - 32px));
    aspect-ratio: 800 / 520;
    height: auto;
    background: #060a18;
    border: 1px solid #2a3a4a;
    border-radius: 6px;
    cursor: pointer;
    touch-action: none;
  }
  #status { margin-top: 8px; font-size: 13px; color: #9fb3c8; }
  .hint { max-width: 720px; margin: 16px auto 0; font-size: 14px; line-height: 1.7; color: #b8cade; }
  .hint b { color: #ffe98a; }
  .chips { margin-top: 10px; }
  .chip {
    display: inline-block; margin: 2px 4px; padding: 2px 10px;
    border: 1px solid #2a3a4a; border-radius: 10px; font-size: 12px; color: #9fb3c8;
  }
</style>
</head>
<body>

<h1>FIREFLY GROVE · 萤火林</h1>
<canvas id="screen"></canvas>
<div id="status">loading module…</div>

<p class="hint">
  <b>怎么玩：按住鼠标或触摸屏，提灯就会亮。</b>萤火会向你聚来，松手它们就四散游荡——
  把整群<b>领回右下角发光的母树</b>。<b>蛛网</b>会粘住萤火，要把灯凑得很近才拉得出来；
  <b>风带</b>会把群吹偏；而<b>夜色本身就是倒计时</b>——天空开始变暖，天就快亮了。
  天亮前送回的比例决定 1–3 星。
</p>
<div class="chips">
  <span class="chip">按住发光</span><span class="chip">蛛网粘滞</span>
  <span class="chip">风带吹偏</span><span class="chip">黎明即终局</span>
</div>

<script>window.DEMO_CONFIG = { width: 800, height: 520, timeTravel: false };</script>
<script src="proto_host.js"></script>
<script src="firefly.js"></script>
</body>
</html>
