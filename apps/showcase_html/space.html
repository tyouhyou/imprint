<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImprintUI - Command Center</title>
    <style>
        /* ImprintUI command center: rewritten against the Imprint HTML/CSS
           subset (docs/html-path.md) so every declaration constructs.
           Layout is percentage/flex throughout: the chassis fills the host
           window (NDS 256x192, desktop 480x360), inner boxes scale with it.
           Whitelist adaptations vs the browser draft: grid lines are
           repeating-linear overlays (one direction per layer, so two
           stacked divs); side borders are divider divs or border-top on the
           next section (only border and border-top exist); the status
           matrix is three flex rows (no grid); the ring is a conic with deg
           stops (percent stops are out); the scan needle and its glow fan
           are an svg overlay (pseudo boxes never resolve percent geometry,
           and only pseudos take rotate - the svg line endpoints bake the
           45-degree angle instead); bar labels are in-flow siblings (no
           translate); flex Grow is integral. Tiny browser px fonts (4-7px)
           are bumped one step (7-9px): a 4px Inter glyph is three faint
           pixels, while the 5x7 bitmap fallback on NDS draws every size
           at 5x7 anyway. */

        :root {
            --bg-deep: #05080a;
            --bg-panel: #0a1116;
            --grid-line: #12202a;
            --neon-green: #00ff9d;
            --neon-cyan: #00e5ff;
            --neon-amber: #ffb300;
            --neon-magenta: #ff00aa;
            --text-dim: #3a4a5a;
            --text-bright: #c0d0e0;
        }

        body {
            background-color: #000;
        }

        /* 主容器 - 充满宿主窗口, 一份文件跑所有平台 */
        .command-center {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, #0a1116 0%, #05080a 100%);
            position: relative;
            border: 2px solid #1a2a3a;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            padding: 6px;
        }

        /* 全局网格背景 - 双叠加层, 各管一个方向 */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.3;
        }
        .grid-v {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, #12202a 0 1px, transparent 1px 12px);
        }
        .grid-h {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, #12202a 0 1px, transparent 1px 12px);
        }

        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
        }
        .sys-title {
            font-size: 9px;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            text-shadow: 0 0 4px var(--neon-cyan);
        }
        .sys-status {
            font-size: 8px;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-dot {
            width: 4px; height: 4px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 4px var(--neon-green);
        }

        /* 主体区域：左右分栏, 上缘线代替原稿的下缘线 */
        .main-content {
            display: flex;
            flex: 1;
            gap: 6px;
            position: relative;
            border-top: 1px solid var(--grid-line);
            padding-top: 4px;
        }

        /* 左侧：主监视器 (声纳) - 纵向容器, 子级的 aspect-ratio 由宽推高 */
        .left-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-right: 4px;
        }
        /* 纵向分隔条, 代替原稿的 border-right */
        .v-rule {
            width: 1px;
            background: var(--grid-line);
        }
        .sonar-screen {
            width: 75%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 0 20px rgba(0, 229, 255, 0.1);
            position: relative;
            background: radial-gradient(circle at 50% 50%, #0a1a2a 0%, #05080a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 声纳网格 - 双叠加层, 圆内裁剪 */
        .sonar-gv {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: repeating-linear-gradient(90deg, rgba(0, 229, 255, 0.1) 0 1px, transparent 1px 12px);
        }
        .sonar-gh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: repeating-linear-gradient(0deg, rgba(0, 229, 255, 0.1) 0 1px, transparent 1px 12px);
        }
        .sonar-circle {
            position: absolute;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 50%;
        }
        .sonar-circle.c1 { width: 80%; height: 80%; left: 10%; top: 10%; }
        .sonar-circle.c2 { width: 60%; height: 60%; left: 20%; top: 20%; }
        .sonar-circle.c3 { width: 40%; height: 40%; left: 30%; top: 30%; }
        .sonar-circle.c4 { width: 20%; height: 20%; left: 40%; top: 40%; }

        /* 扫描针与光晕扇 - svg 叠加层, 45 度角直接 baked 进端点 */
        .sonar-svg {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
        }

        /* 目标光点 - 声纳是正方形, 宽高取相同百分比即正圆 */
        .blip {
            position: absolute;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-green), 0 0 12px var(--neon-green);
        }
        .blip.b1 { top: 30%; left: 40%; width: 4%; height: 4%; }
        .blip.b2 { top: 60%; left: 70%; width: 3%; height: 3%; opacity: 0.7; }
        .blip.b3 { top: 70%; left: 30%; width: 2%; height: 2%; opacity: 0.5; }

        /* 右侧：数据面板 */
        .right-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: space-between;
        }

        /* 右上：垂直柱状图, 标签是柱下行内兄弟 */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 32%;
            padding: 2px 0;
        }
        .bar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 12%;
            height: 100%;
        }
        .bar {
            width: 60%;
            background: var(--neon-amber);
            box-shadow: 0 0 4px var(--neon-amber);
            border-radius: 1px;
            position: relative;
        }
        .bar.dim {
            background: var(--text-dim);
            box-shadow: none;
        }
        .bar-label {
            font-size: 7px;
            color: var(--text-dim);
        }

        /* 右中：环形进度 + 状态矩阵, 上缘线代替原稿的下缘线 */
        .mid-section {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
            height: 30%;
            border-top: 1px solid var(--grid-line);
        }
        .ring-cell {
            width: 24%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .ring-progress {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff00aa 0deg, #ff00aa 259deg, #12202a 259deg, #12202a 360deg);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(255, 0, 170, 0.3);
        }
        .ring-inner {
            width: 70%;
            aspect-ratio: 1;
            background: var(--bg-deep);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            color: var(--neon-magenta);
            text-shadow: 0 0 4px var(--neon-magenta);
        }
        .status-matrix {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            height: 100%;
        }
        .mrow {
            display: flex;
            gap: 2px;
            flex: 1;
        }
        .matrix-cell {
            flex: 1;
            background: var(--neon-green);
            box-shadow: 0 0 3px var(--neon-green);
            border-radius: 1px;
        }
        .matrix-cell.dim {
            background: var(--text-dim);
            box-shadow: none;
        }
        .matrix-cell.warn {
            background: var(--neon-amber);
            box-shadow: 0 0 3px var(--neon-amber);
        }

        /* 右下：文本日志 - 行距代替多行 pitch, 单行标签不吃 line-height */
        .log-section {
            font-size: 7px;
            color: var(--text-dim);
            line-height: 9px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
            flex: 1;
            border-top: 1px solid var(--grid-line);
            padding-top: 2px;
        }
        .log-line {
            display: flex;
            justify-content: space-between;
        }
        .log-value {
            color: var(--neon-cyan);
            text-shadow: 0 0 3px var(--neon-cyan);
        }
        .log-value.green {
            color: var(--neon-green);
            text-shadow: 0 0 3px var(--neon-green);
        }

        /* 底部数据栏 */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
            border-top: 1px solid var(--grid-line);
            margin-top: 4px;
        }
        .data-item {
            font-size: 8px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .data-value {
            color: var(--neon-cyan);
            text-shadow: 0 0 4px var(--neon-cyan);
        }
        .data-value.green {
            color: var(--neon-green);
            text-shadow: 0 0 4px var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="command-center">
        <!-- 背景网格 -->
        <div class="grid-bg"><div class="grid-v"></div><div class="grid-h"></div></div>

        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="sys-title">IMPRINT // COMMAND CENTER</div>
            <div class="sys-status">
                <div class="status-dot"></div>
                ONLINE
            </div>
        </div>

        <!-- 主体内容 -->
        <div class="main-content">
            <!-- 左侧：主监视器 -->
            <div class="left-panel">
                <div class="sonar-screen">
                    <div class="sonar-gv"></div>
                    <div class="sonar-gh"></div>
                    <div class="sonar-circle c1"></div>
                    <div class="sonar-circle c2"></div>
                    <div class="sonar-circle c3"></div>
                    <div class="sonar-circle c4"></div>
                    <div class="blip b1"></div>
                    <div class="blip b2"></div>
                    <div class="blip b3"></div>
                    <svg class="sonar-svg" viewBox="0 0 100 100">
                        <g stroke="#00e5ff" stroke-linecap="round">
                            <line x1="50" y1="50" x2="80.3" y2="67.5" stroke-width="5" opacity="0.12"/>
                            <line x1="50" y1="50" x2="78" y2="71.1" stroke-width="5" opacity="0.12"/>
                            <line x1="50" y1="50" x2="74.7" y2="74.7" stroke-width="5" opacity="0.12"/>
                            <line x1="50" y1="50" x2="71.1" y2="78" stroke-width="5" opacity="0.12"/>
                            <line x1="50" y1="50" x2="67.5" y2="80.3" stroke-width="5" opacity="0.12"/>
                            <line x1="50" y1="50" x2="75" y2="75" stroke-width="2" opacity="0.95"/>
                        </g>
                    </svg>
                </div>
            </div>
            <div class="v-rule"></div>

            <!-- 右侧：数据面板 -->
            <div class="right-panel">
                <!-- 右上：垂直柱状图 -->
                <div class="bar-chart">
                    <div class="bar-wrap"><div class="bar" style="height: 70%;"></div><span class="bar-label">S1</span></div>
                    <div class="bar-wrap"><div class="bar" style="height: 42%;"></div><span class="bar-label">S2</span></div>
                    <div class="bar-wrap"><div class="bar" style="height: 84%;"></div><span class="bar-label">S3</span></div>
                    <div class="bar-wrap"><div class="bar" style="height: 28%;"></div><span class="bar-label">S4</span></div>
                    <div class="bar-wrap"><div class="bar dim" style="height: 14%;"></div><span class="bar-label">S5</span></div>
                </div>

                <!-- 右中：环形进度 + 状态矩阵 -->
                <div class="mid-section">
                    <div class="ring-cell">
                        <div class="ring-progress">
                            <div class="ring-inner">72%</div>
                        </div>
                    </div>
                    <div class="status-matrix">
                        <div class="mrow">
                            <div class="matrix-cell"></div>
                            <div class="matrix-cell"></div>
                            <div class="matrix-cell warn"></div>
                        </div>
                        <div class="mrow">
                            <div class="matrix-cell"></div>
                            <div class="matrix-cell dim"></div>
                            <div class="matrix-cell dim"></div>
                        </div>
                        <div class="mrow">
                            <div class="matrix-cell"></div>
                            <div class="matrix-cell dim"></div>
                            <div class="matrix-cell dim"></div>
                        </div>
                    </div>
                </div>

                <!-- 右下：文本日志 -->
                <div class="log-section">
                    <div class="log-line"><span>DEPTH</span><span class="log-value">6500M</span></div>
                    <div class="log-line"><span>SIG</span><span class="log-value green">-12dB</span></div>
                    <div class="log-line"><span>TMP</span><span class="log-value">24C</span></div>
                    <div class="log-line"><span>PWR</span><span class="log-value green">98%</span></div>
                </div>
            </div>
        </div>

        <!-- 底部数据栏 -->
        <div class="bottom-bar">
            <div class="data-item">MODE <span class="data-value">DEEP SCAN</span></div>
            <div class="data-item">FPS <span class="data-value green">60</span></div>
            <div class="data-item">LAT <span class="data-value">0.2ms</span></div>
        </div>
    </div>

</body>
</html>
