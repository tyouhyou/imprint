# Tiered CI: Tier 1/2 run on every push and PR, Tier 3 (embedded/web
# packaging + sanitizers) on the weekly schedule or manual dispatch.
#
# Discipline from the repo's build matrix (CONTEXT.md / README "Build"):
#   - tests run in Debug only (or the default no-config build); Release
#     distorts the allocation gates. The one Release job
#     (linux-warnings-release) builds without running them: its subject is
#     the -O2 diagnostics, not the batteries (W-15)
#   - USE_PNG / USE_JPEG run in Tier 2 (linux-codecs); USE_TTF_RUNTIME in
#     Tier 2 (linux-ttf-runtime); the absorbed imraster module in Tier 2
#     (linux-raster); the NDS cross build and the non-atomic
#     variant cover the rest of the matrix
#   - the gcc:13 container ships no python3: the font-subset generation
#     (FONT_SUBSET, default ON) silently degrades to ASCII-only glyphs
#     without it, so every Linux job installs python3 explicitly

name: CI

on:
  push:
  pull_request:
  schedule:
    # Tier 3 full matrix, Mondays 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- Tier 1: desktop core ----------------

  linux-desktop:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure and build
        run: |
          cmake -S . -B build_ci
          cmake --build build_ci -j"$(nproc)"
      - name: Run test suites and C-ABI smoke
        run: |
          ./build_ci/bin/test_imui
          ./build_ci/bin/test_zbapi
      - name: External-consumption smoke (library mode, Batch G P1)
        run: |
          cmake -S test/external_smoke -B build_ci/external_smoke
          cmake --build build_ci/external_smoke -j"$(nproc)"
          ./build_ci/external_smoke/bin/external_smoke
      - name: Installed-config smoke (find_package, Batch G P1.5)
        run: |
          cmake --install build_ci --prefix build_ci/staging
          cmake -S test/installed_smoke -B build_ci/installed_smoke -DIMPRINT_STAGING_PREFIX=${PWD}/build_ci/staging
          cmake --build build_ci/installed_smoke -j"$(nproc)"
          ./build_ci/installed_smoke/bin/installed_smoke
      - name: imprint-render determinism smoke (Batch G P2)
        run: |
          cmake --build build_ci --target imprint-render
          ./build_ci/bin/imprint-render tools/examples/menu.ui --out build_ci/menu1.png
          ./build_ci/bin/imprint-render tools/examples/menu.ui --out build_ci/menu2.png
          cmp build_ci/menu1.png build_ci/menu2.png
          ./build_ci/bin/imprint-render assets/designs/imprint_console.html --out build_ci/hero.png

  # X-19: the format gate is a build-independent check, so it fails the
  # job in seconds when a commit drifts. It is its own job: the gcc:13
  # (Debian bookworm) container of the build jobs has no clang-format-18
  # package, so the old step inside linux-desktop died at install and
  # masked every later linux-desktop step
  format-gate:
    # noble's apt is the distro source of clang-format 18.1.3, the exact
    # version tools/format-check.sh pins -- do not use ubuntu-latest (it
    # moves past Ubuntu 24.04 and drops this package)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: clang-format gate (X-19)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          sh tools/format-check.sh

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        # no -G: GitHub retires VS toolchain versions with image updates,
        # so take the runner's default (latest installed) generator
        run: |
          cmake -S . -B build_ci
          cmake --build build_ci --config Debug
      # X-8: MSVC has no local verifier (no Visual Studio outside the
      # windows-* runners) and /WX stops at the first warning, so a red run
      # would otherwise report one warning per round. When the gate fails,
      # build the whole tree again with the error gate off and list every
      # diagnostic -- the CI mirror of the local `warnings-survey`. The
      # gate step above stays `IMPRINT_WERROR=ON` (the in-tree default).
      - name: MSVC warning inventory (after a failed gate)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake -S . -B build_diag -DIMPRINT_WERROR=OFF *> build_diag.log
          cmake --build build_diag --config Debug *>> build_diag.log
          $build_ok = $LASTEXITCODE -eq 0
          $summary = "## MSVC warning inventory (-DIMPRINT_WERROR=OFF)`n"
          if (Test-Path build_diag.log) {
            $warnings = Select-String -Path build_diag.log -Pattern ': warning [A-Z]+[0-9]+:' |
              ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          } else {
            $warnings = @()
            Write-Host "the inventory build produced no log (configure failed?)"
          }
          if ($warnings.Count -eq 0) {
            $summary += "no compiler warning: the failure above is not a warning"
            Write-Host "full -DIMPRINT_WERROR=OFF build reported no compiler warning; the failure above is not a warning"
          } else {
            Write-Host "MSVC diagnostics (unique lines: $($warnings.Count)):"
            $warnings | ForEach-Object { Write-Host "  $_" }
            $summary += '```' + "`n" + ($warnings -join "`n") + "`n" + '```' + "`n"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ((-not $build_ok) -and (Test-Path build_diag.log)) {
            Write-Host "the inventory build itself did not complete; its last lines:"
            Get-Content build_diag.log -Tail 40
          }
      - name: Run test suites and C-ABI smoke
        run: |
          ./build_ci/bin/Debug/test_imui.exe
          ./build_ci/bin/Debug/test_zbapi.exe

  # ---------------- Tier 2: matrix variants ----------------

  # X-8: the whole tree (libraries, tests, tools, apps) under the project
  # warning set with -Werror, in its own build dir so a warning cannot hide
  # behind an incremental build. Every other job compiles under the same
  # set (IMPRINT_WERROR defaults ON in-tree); this job names the contract
  # and fails first when a new compiler diagnostic enters the tree. The
  # set itself is cmake/imprint-warnings.cmake; `warnings-survey` (kit)
  # is the local, -Werror-off mirror used to triage a change to it.
  linux-warnings:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure and build (project warning set + -Werror)
        # IMPRINT_WERROR spelled out: the job exists to enforce the
        # contract, so it must not ride a default that another
        # configuration could flip (the kit `warnings-test` does the same)
        run: |
          cmake -S . -B build_warn -DIMPRINT_WERROR=ON
          cmake --build build_warn -j"$(nproc)"

  # The Release half of the warning gate. Every other job configures
  # without a build type, so they are all -O0 and the optimization passes
  # never run -- the diagnostics that only fire at -O2 (-Wnull-dereference
  # among them) used to reach CI nowhere, while a Release build is the
  # documented path for a consumer and the only valid one for performance
  # work. Build-only on purpose: the batteries stay Debug-shaped (W-12).
  linux-warnings-release:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure and build (Release, project warning set + -Werror)
        run: |
          cmake -S . -B build_warn_release -DCMAKE_BUILD_TYPE=Release -DIMPRINT_WERROR=ON
          cmake --build build_warn_release -j"$(nproc)"

  # X-21: `imshell/src/win/*` is compiled only by MSVC in windows-desktop,
  # which cannot see the GCC families the rest of the tree is held to
  # (-Wold-style-cast, -Wmissing-field-initializers, shadow, sign-compare).
  # This job runs the project warning set over exactly those sources
  # through a mingw-w64 cross build -- the CI mirror of the local
  # `win-probe` kit target and of README "Build" row "Windows TU probe".
  # MSVC-only diagnostics stay windows-desktop's (and its failure-only
  # warning-inventory step's) job; the two jobs together cover the TU.
  mingw-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
      - name: Configure and build the Windows shell TUs (project warning set + -Werror)
        run: |
          cmake -S . -B build_win_probe \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DSTORY=hello \
            -DIMPRINT_WERROR=ON
          cmake --build build_win_probe -j"$(nproc)" --target shell_common shell_hostloop hello

  linux-16bpp:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (COLOR_DEPTH=16)
        run: |
          cmake -S . -B build_ci -DCOLOR_DEPTH=16
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui
          ./build_ci/bin/test_zbapi

  # L-5: the runtime TTF provider has zero behavioral coverage outside
  # this job (wasm compiles it, nothing runs it): the runtime_ttf suite
  # is compiled in only under USE_TTF_RUNTIME
  linux-ttf-runtime:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (USE_TTF_RUNTIME=ON)
        run: |
          cmake -S . -B build_ci -DUSE_TTF_RUNTIME=ON
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui

  # A-29 Phase 1: the absorbed 3D raster module has zero behavioral
  # coverage outside this job -- the `raster` suite rides test_imui only
  # when IMPRINT_WITH_IMRASTER=ON and the pixel model resolves to
  # rgba32/le (the module's static_assert + configure gate, ARCHITECTURE
  # §4.12). Doubles as whole-framework coverage of a third pixel memory
  # order ({r,g,b,a}; the desktop defaults are {b,g,r,a}).
  linux-raster:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (IMPRINT_WITH_IMRASTER=ON, RGB_MODEL=rgba32 ENDIAN=le)
        run: |
          cmake -S . -B build_ci -DIM_SHELL_BACKEND=X11 -DRGB_MODEL=rgba32 -DENDIAN=le -DIMPRINT_WITH_IMRASTER=ON
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui

  # the whole framework linked against the non-atomic SharedPtr branch
  # and the integer-geometry path (the NDS build: no libatomic, no FPU);
  # test_ptr.cpp locks the refcount semantics, this job locks the rest of
  # the framework on top of both variants
  linux-nonatomic-ptr:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (USE_NON_ATOMIC_PTR=ON + USE_INTEGER_GEOMETRY=ON)
        run: |
          cmake -S . -B build_ci -DUSE_NON_ATOMIC_PTR=ON -DUSE_INTEGER_GEOMETRY=ON
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui
          ./build_ci/bin/test_zbapi

  linux-codecs:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (USE_PNG + USE_JPEG, vendored stb)
        run: |
          cmake -S . -B build_ci -DUSE_PNG=ON -DUSE_JPEG=ON
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui

  # A-28: the post-core feature gates (inventory in ARCHITECTURE §4.9).
  # The off configuration is a library-mode consumer build -- the gated
  # front-ends' consumers (showcase*, ui_preview, the design tools and
  # their suites) are story-level and not part of it. The smoke then
  # asserts the stub contract: the parser symbols stay link-complete and
  # every document is rejected (code-contract §5.4), so enabling the gate
  # never turns a public surface into a link error. The last step is the
  # realistic single-gate configs (one front-end off, everything else
  # on, both directions): the gated suites drop out by the same condition
  # that drops their apps, and test_zbapi compiles its declarative
  # sections out under the same 0/1 defines -- the remaining battery
  # (test_imui + test_zbapi) still runs.
  linux-features-off:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure and build (both front-ends off, project warning set + -Werror)
        run: |
          cmake -S . -B build_ci \
            -DIMPRINT_FEATURE_HTML=OFF -DIMPRINT_FEATURE_UI_FILE=OFF \
            -DIMPRINT_WITH_DEMOS=OFF -DIMPRINT_WITH_TESTS=OFF \
            -DIMPRINT_WITH_TOOLS=OFF -DIMPRINT_WITH_SHELL=OFF \
            -DIMPRINT_WERROR=ON
          cmake --build build_ci -j"$(nproc)"
      - name: Consumer smoke under the same closure
        run: |
          cmake -S test/external_smoke -B build_smoke \
            -DIMPRINT_FEATURE_HTML=OFF -DIMPRINT_FEATURE_UI_FILE=OFF \
            -DIMPRINT_WERROR=ON
          cmake --build build_smoke -j"$(nproc)"
          ./build_smoke/bin/external_smoke
      - name: Single-gate configs (one front-end off, suites on) and the battery
        run: |
          cmake -S . -B build_ci_gate_html_off \
            -DIMPRINT_FEATURE_HTML=OFF -DIMPRINT_FEATURE_UI_FILE=ON \
            -DIMPRINT_WERROR=ON
          cmake --build build_ci_gate_html_off -j"$(nproc)"
          ./build_ci_gate_html_off/bin/test_imui
          ./build_ci_gate_html_off/bin/test_zbapi
          cmake -S . -B build_ci_gate_uifile_off \
            -DIMPRINT_FEATURE_HTML=ON -DIMPRINT_FEATURE_UI_FILE=OFF \
            -DIMPRINT_WERROR=ON
          cmake --build build_ci_gate_uifile_off -j"$(nproc)"
          ./build_ci_gate_uifile_off/bin/test_imui
          ./build_ci_gate_uifile_off/bin/test_zbapi

  linux-x11:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # xauth is what xvfb-run drives the server with; the gcc:13 image
        # has neither it nor the --no-install-recommends Recommends edge
        # (the first run of this job died on "xauth command not found")
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3 libx11-dev xvfb xauth
      - name: Configure and build (X11 backend)
        run: |
          cmake -S . -B build_ci -DIM_SHELL_BACKEND=X11
          cmake --build build_ci -j"$(nproc)"
      # X-7: the only job that executes a real shell event loop. Everything
      # else compiles the loops and never runs one; the suite drives run()
      # twice in one process (code-contract 11.1) and asserts the frame
      # reached the app buffer and that no shell handler survived the loop.
      # IM_TEST_REQUIRE_DISPLAY turns a missing server into a failure, so
      # this coverage cannot silently degrade to a skip.
      - name: Shell loop battery (X11 under Xvfb)
        run: |
          xvfb-run -a env IM_TEST_REQUIRE_DISPLAY=1 ./build_ci/bin/test_imui shell_loop

  linux-fb:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      # compile-only: the CI container has no /dev/fb0 (A-1: the FB
      # shell carries the presentation-seam row converter)
      - name: Configure and build (FB backend)
        run: |
          cmake -S . -B build_ci -DIM_SHELL_BACKEND=FB
          cmake --build build_ci -j"$(nproc)"

  # P4 demo target: compile-only like linux-fb; the sixel/term_input
  # logic itself is unit-tested from the battery (pure TUs)
  linux-sixel:
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure and build (SIXEL backend)
        run: |
          cmake -S . -B build_ci -DIM_SHELL_BACKEND=SIXEL
          cmake --build build_ci -j"$(nproc)"

  # A-20: the AppKit shell compiles on every push; the desktop core
  # battery runs too (it needs no display). Behavior of the shell itself
  # is verified on the maintainer's macOS 13 machine, not in CI
  macos-desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (AppKit backend)
        run: |
          cmake -S . -B build_ci
          cmake --build build_ci -j"$(sysctl -n hw.ncpu)"
      - name: Run test suites and C-ABI smoke
        run: |
          ./build_ci/bin/test_imui
          ./build_ci/bin/test_zbapi

  # ---------------- Tier 3: full matrix (weekly / manual) ----------------

  nds-rom:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build the ROM (devkitARM container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src devkitpro/devkitarm:20260610 \
            sh -c 'cmake -S . -B build_nds_ci -DCMAKE_TOOLCHAIN_FILE=cmake/nds.toolchain.cmake && cmake --build build_nds_ci'
      - name: Check the packaged ROM exists
        run: test -f build_nds_ci/bin/tictactoe.nds

  wasm-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build browser + node targets, run the node smoke test
        run: |
          docker run --rm -v "$PWD:/src" emscripten/emsdk:5.0.1 \
            sh -c 'cd /src && sh demo/wasm/build.sh && cd demo/wasm && node smoke.js'
      - name: Build the showcase story, run its node smoke test
        run: |
          docker run --rm -v "$PWD:/src" emscripten/emsdk:5.0.1 \
            sh -c 'cd /src && sh demo/wasm/build.sh showcase && node demo/wasm/smoke.js /src/demo/wasm/showcase_mod.js'

  python-host:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pygame
        run: pip3 install pygame
      # X-11: the decode check needs no pygame, no display and no built
      # library -- it compiles a 16bpp pixel-traits probe and compares the
      # host decoder against the framework's own packing. The host used to
      # decode abgr1555 as RGB565 (red/blue swapped) and nothing caught it.
      - name: Framebuffer decode check (X-11)
        run: python3 demo/python/test_framebuffer.py
      # The FB backend, not the UNIX default X11 one: this job runs on the
      # bare ubuntu-latest image, which ships xvfb but no libx11-dev, and
      # the X-2 change made the X11 backend a hard `find_package(X11
      # REQUIRED)` -- the cron run died at configure with "Could NOT find
      # X11". zbapi needs no window system at all (the host is pygame), so
      # pick the backend that carries no package requirement instead of
      # installing one. Every other Linux job keeps the X11 default; they
      # run inside the gcc:13 container, which does carry the headers.
      - name: Build the C-ABI host library
        run: |
          cmake -S . -B build_ci -DIM_SHELL_BACKEND=FB
          cmake --build build_ci --target zbapi -j"$(nproc)"
      - name: Headless host smoke (SDL dummy driver)
        run: |
          SDL_VIDEODRIVER=dummy python3 demo/python/myapp.py \
            --lib build_ci/lib/libzbapi.so --frames 20 | tee smoke.log
          grep -q "ran 20 frames" smoke.log
          grep -q "painted callback fired 1 times" smoke.log

  asan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: gcc:13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make python3
      - name: Configure, build, test (AddressSanitizer + UBSan)
        run: |
          cmake -S . -B build_ci \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_ci -j"$(nproc)"
          ./build_ci/bin/test_imui
          ./build_ci/bin/test_zbapi
